name: Video diario Miguel y Clapy

on:
  schedule:
    # 09:17 UTC = 3:17 a.m. hora de Ciudad de Mexico (UTC-6, sin horario de verano)
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha del episodio (AAAA-MM-DD). Vacio = hoy"
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Revisar minutos gratis del mes (limite 2000)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          M=$(date -u +%Y-%m)
          USED=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100&created=>=$M-01" --jq '[.workflow_runs[] | select(.run_started_at!=null and .status=="completed") | (((.updated_at|fromdateiso8601)-(.run_started_at|fromdateiso8601))/60|ceil)] | add // 0')
          echo "Minutos usados este mes: $USED de 2000"
          if [ "$USED" -gt 1930 ]; then
            echo "::error::LIMITE: ya se usaron $USED de 2000 minutos este mes. No hago el video para no pasarme."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Paquetes del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-inter libcairo2-dev pkg-config
          fc-cache -f

      - name: Dependencias
        run: |
          npm ci || npm install
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Cache de voces
        uses: actions/cache@v4
        with:
          path: cache/voices
          key: voices-${{ github.run_id }}
          restore-keys: voices-

      - name: Hacer el video
        id: ep
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python pipeline/make_episode.py --date "${{ github.event.inputs.date }}"
          else
            python pipeline/make_episode.py
          fi

      - name: Marcar episodio como hecho
        run: |
          git config user.name "miguel-y-clapy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes/done.txt || true
          git commit -m "Episodio hecho: ${{ steps.ep.outputs.name }}" || true
          git pull --rebase || true
          git push || true

      - name: Publicar video para descargar (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ep-${{ steps.ep.outputs.name }}" \
            "${{ steps.ep.outputs.video }}" "${{ steps.ep.outputs.notes }}" \
            --title "${{ steps.ep.outputs.title }}" \
            --notes-file "${{ steps.ep.outputs.notes }}"
